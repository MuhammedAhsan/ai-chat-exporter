name: 🐛 Bug report
description: Something in the extension is broken or exports incorrectly
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Only the first three fields are required —
        fill in as much of the rest as you feel like.

        **🔒 Please don't paste a real conversation.** Issues are public and
        permanent. Describing the content is enough, and screenshots are best
        cropped.

  - type: dropdown
    id: site
    attributes:
      label: Which chat site?
      options:
        - ChatGPT
        - Claude
        - Gemini
        - Perplexity
        - DeepSeek
        - More than one site
        - Not site-specific (popup, settings, editor)
    validations:
      required: true

  - type: dropdown
    id: formats
    attributes:
      label: Which export format?
      description: >-
        Tick any you tried. If one format is wrong and another is fine, that
        alone usually points straight at the cause.
      multiple: true
      options:
        - PDF
        - DOCX
        - HTML
        - Markdown
        - TXT
        - JSON
        - Copy as Markdown
        - Not an export problem
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
      description: >-
        What happened, and what you expected instead. A couple of sentences is
        fine.
      placeholder: >-
        Exported to PDF and every code block lost its indentation — it all ran
        together as one paragraph. Expected the code to keep its line breaks.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can I reproduce it? *(optional)*
      description: >-
        Roughly what you clicked. Also useful: whether it happens every time, and
        whether it used to work.

  - type: input
    id: versions
    attributes:
      label: Versions *(optional)*
      description: >-
        Extension version is in `chrome://extensions`.
      placeholder: "Extension 2.7.0, Chrome 141, Windows 11"

  - type: textarea
    id: extra
    attributes:
      label: Anything else? *(optional)*
      description: >-
        Screenshots (cropped), what kind of content was in the conversation —
        code, tables, equations, images — or console errors from right-clicking
        the popup → Inspect → Console.

  - type: checkboxes
    id: privacy-ack
    attributes:
      label: One last thing
      options:
        - label: I haven't included private conversation content, and any screenshot is cropped
          required: true
