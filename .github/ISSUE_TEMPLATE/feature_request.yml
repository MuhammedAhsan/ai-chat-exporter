name: 💡 Feature request
description: Suggest something the extension should do
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas genuinely shape what gets built next, so thank you.

        Only the first field is required — everything else is optional.

        **🔒 Please don't paste a real conversation** if you're illustrating
        something. Issues are public and permanent.

  - type: textarea
    id: idea
    attributes:
      label: What would you like the extension to do?
      description: >-
        If you can, say what you're doing today and where it gets awkward — the
        problem behind the idea often has a better answer than either of us
        thought of first.
      placeholder: >-
        A way to drop my own messages in one click. I export long research
        threads and only want the answers, so I delete them by hand every time.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the extension? (optional)
      multiple: true
      options:
        - Export formats (PDF, DOCX, HTML, Markdown, TXT, JSON)
        - The popup — Export tab
        - The popup — Messages tab
        - The popup — Settings tab
        - Edit before export (the overlay editor)
        - Redaction
        - Sharing and clipboard
        - Support for a new chat site
        - Something else

  - type: input
    id: new-site
    attributes:
      label: Asking for a new site? Which one? (optional)
      description: >-
        The address of the chat page. Each site needs its own adapter, so how
        many people ask for a given one is what decides the order.
      placeholder: "https://example.ai/chat/…"

  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: >-
        Mockups, how another tool does it, or what you do instead today.
